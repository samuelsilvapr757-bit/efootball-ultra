name: Build eFootball Ultra

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
      
      - name: Build
        run: |
          export THEOS=$HOME/theos
          make package ARCHS=arm64 DEBUG=0
          
      - name: Upload tudo (dylib + plist + deb)
        uses: actions/upload-artifact@v4
        with:
          name: eFootballUltra-COMPLETO
          path: |
            .theos/obj/debug/arm64/eFootballUltra.dylib
            .theos/obj/arm64/eFootballUltra.dylib
            eFootballUltra.plist
            packages/*.deb
          if-no-files-found: warn
